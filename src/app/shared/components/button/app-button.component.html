<button
  class="app-btn app-btn--{{ resolvedVariant }} app-btn--{{ size }}"
  [class.app-btn--icon-only]="iconOnly"
  [class.app-btn--loading]="loading"
  [type]="type"
  [attr.form]="form || null"
  [disabled]="disabled || loading"
  [attr.aria-label]="ariaLabel"
  [attr.aria-busy]="loading || null"
  (click)="onClick($event)"
>
  @if (loading) {
    <mat-spinner class="app-btn__spinner" [diameter]="size === 'sm' ? 14 : 18"></mat-spinner>
  } @else if (icon && (iconOnly || iconPosition === 'left')) {
    <mat-icon class="app-btn__icon" [fontSet]="iconOutlined ? 'material-icons-outlined' : ''">{{ icon }}</mat-icon>
  }
  @if (!iconOnly) {
    <span class="app-btn__label"><ng-content></ng-content></span>
  }
  @if (!loading && icon && !iconOnly && iconPosition === 'right') {
    <mat-icon class="app-btn__icon" [fontSet]="iconOutlined ? 'material-icons-outlined' : ''">{{ icon }}</mat-icon>
  }
</button>
