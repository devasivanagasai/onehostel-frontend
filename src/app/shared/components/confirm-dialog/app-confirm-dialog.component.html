<div class="confirm confirm--{{ tone }}">
  <app-button class="confirm__close" variant="icon" icon="close" ariaLabel="Close" (clicked)="onCancel()"></app-button>

  <div class="confirm__header">
    <div class="confirm__icon" aria-hidden="true">
      <mat-icon>{{ icon }}</mat-icon>
    </div>
    <h2 class="confirm__title" mat-dialog-title>{{ data.title }}</h2>
  </div>

  <mat-dialog-content class="confirm__content">
    <p class="confirm__message">{{ data.message }}</p>

    @if (data.details?.length) {
      <ul class="confirm__details">
        @for (d of data.details; track d.label) {
          <li>
            <span class="confirm__detail-icon"><mat-icon>{{ d.icon }}</mat-icon></span>
            <span class="confirm__detail-text">
              <span class="confirm__detail-label">{{ d.label }}</span>
              <span class="confirm__detail-value">{{ d.value }}</span>
            </span>
          </li>
        }
      </ul>
    }

    @if (data.note) {
      <div class="confirm__note">
        <mat-icon>info</mat-icon>
        <span>{{ data.note }}</span>
      </div>
    }
  </mat-dialog-content>

  <div class="confirm__actions">
    <app-button variant="secondary" [block]="true" (clicked)="onCancel()">{{ data.cancelLabel ?? 'Cancel' }}</app-button>
    <app-button class="confirm__confirm" [variant]="confirmVariant" [block]="true" (clicked)="onConfirm()">
      {{ data.confirmLabel ?? 'Confirm' }}
    </app-button>
  </div>
</div>
